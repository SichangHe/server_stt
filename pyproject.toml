[project]
name = "server-stt"
version = "0.1.0"
description = "Local file transcription with speaker labels on Linux servers"
requires-python = ">=3.12"
dependencies = ["faster-whisper==1.2.1", "av>=11,<17", "sherpa-onnx==1.12.26", "sherpa-onnx-core==1.12.26", "pydantic>=2,<3"]

[project.optional-dependencies]
qwen = ["qwen-asr==0.0.6", "torch==2.9.1+cpu"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
server-stt = "server_stt.cli:main"
server-stt-models = "server_stt.models:main"
server-stt-diarization-models = "server_stt.diarization_models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "basedpyright", "meeteval==0.4.3"]

[tool.basedpyright]
typeCheckingMode = "standard"
